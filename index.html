<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ella">
<title>Ella's Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  /* Layout: parent menu of 7 big tiles; each game takes the whole screen with no visible controls. Single bright look. */
  :root {
    --bg: #fff3c4; --bg2: #ffe08a; --ink: #3a2a14; --muted: #8c7a5a;
    --tile: #ffffff; --tile-edge: #f0c86a;
    --b1: #ff5c5c; --b2: #ffc83d; --b3: #4cd98a; --b4: #5ab0ff; --b5: #c77dff; --b6: #ff8ac2;
    --dark: #1a1230;
    --font: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; position: relative;
  }
  .screen { position: absolute; inset: 0; }
  [hidden] { display: none !important; }

  /* ---------- parent menu (glass + jelly) ---------- */
  #menu {
    overflow-y: auto; touch-action: pan-y; box-sizing: border-box;
    padding-block: 0 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(160deg, #FFF4EC 0%, #F6EEFB 45%, #EEF3FB 100%);
    --m-ink: #3B3350; --m-muted: #857C99;
  }
  .menu-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .menu-bg .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .75; animation: mFloat 18s ease-in-out infinite alternate; }
  .menu-bg .b1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: #FFD3B8; }
  .menu-bg .b2 { width: 40vmax; height: 40vmax; right: -14vmax; top: 6vmax; background: #D9C9FF; animation-duration: 22s; }
  .menu-bg .b3 { width: 38vmax; height: 38vmax; left: 20vmax; bottom: -18vmax; background: #C6F0E0; animation-duration: 26s; }
  .menu-bg .b4 { width: 28vmax; height: 28vmax; right: 8vmax; bottom: -6vmax; background: #FFC9DF; animation-duration: 20s; }
  @keyframes mFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(3vmax, 2vmax) scale(1.08); } }
  .menu-bg .ribbon { position: absolute; left: -5%; top: 18%; width: 110%; height: auto; opacity: .85; filter: blur(.3px);
                     animation: mDrift 14s ease-in-out infinite alternate; }
  @keyframes mDrift { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(2.5vh) rotate(1deg); } }
  .menu-bg .pearl { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff 0 8%, #fdf6ff 18%, #e9ddf3 45%, #cdbfdc 70%, #f4e6ff 88%, #fff 100%);
    box-shadow: inset -6px -10px 18px rgba(140,110,170,.25), inset 6px 8px 14px rgba(255,255,255,.8), 0 14px 30px -10px rgba(120,90,160,.35);
    animation: mBob 7s ease-in-out infinite alternate; }
  .menu-bg .p1 { width: 74px; height: 74px; right: 9%; top: 96px; }
  .menu-bg .p2 { width: 40px; height: 40px; left: 6%; top: 46%; animation-duration: 9s; }
  .menu-bg .p3 { width: 54px; height: 54px; right: 14%; bottom: 12%; animation-duration: 8s; }
  .menu-bg .bubble { position: absolute; border-radius: 50%; width: 58px; height: 58px; left: 12%; bottom: 20%;
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,.15) 30%, rgba(200,170,255,.18) 70%, rgba(255,200,230,.45) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); animation: mBob 10s ease-in-out infinite alternate; }
  .menu-bg .drop { position: absolute; width: 34px; height: 46px; right: 22%; top: 46%; border-radius: 50% 50% 50% 50% / 62% 62% 40% 40%;
    background: radial-gradient(circle at 35% 62%, #fff 0 8%, #FFE7B8 22%, #E8B25C 58%, #B97E2E 100%);
    box-shadow: 0 10px 20px -8px rgba(185,126,46,.45); animation: mBob 6s ease-in-out infinite alternate; }
  .menu-bg .drop::before { content: ""; position: absolute; left: 50%; top: -14px; width: 20px; height: 22px; margin-left: -10px;
    background: inherit; border-radius: 50% 50% 0 50%; transform: rotate(45deg); z-index: -1; }
  @keyframes mBob { from { transform: translateY(0); } to { transform: translateY(-14px); } }

  .menu-inner { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .hero { padding-block: 26px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .hero h1 { margin: 0 0 0 -6px; width: min(100%, 460px); line-height: 0; cursor: pointer; transform-origin: 50% 85%; }
  .hero h1 img { width: 100%; height: auto; display: block; -webkit-user-drag: none; pointer-events: none; }
  .hero h1 { animation: jellyIdle 4.5s ease-in-out infinite; }
  .hero h1.wobble { animation: jellyWobble .9s cubic-bezier(.3,1.6,.5,1); }
  @keyframes jellyIdle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,.988); } }
  @keyframes jellyWobble {
    0% { transform: scale(1,1); } 20% { transform: scale(1.08,.88); } 40% { transform: scale(.94,1.08); }
    60% { transform: scale(1.03,.97); } 80% { transform: scale(.99,1.01); } 100% { transform: scale(1,1); } }
  .hero .sub { font-size: 14px; color: var(--m-muted); margin: 0 0 0 4px; }

  .howto {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: rgba(255,255,255,.42); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.75); border-radius: 18px; padding: 12px 16px;
    box-shadow: 0 10px 30px -18px rgba(110,80,150,.35);
    font-size: 13px; line-height: 1.5; color: var(--m-ink);
  }
  .howto .k { display: inline-flex; align-items: center; gap: 6px; }
  .howto .k b { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; font-size: 13px;
    background: radial-gradient(circle at 35% 30%, #fff, #F1E6FF 60%, #E2D3F7); box-shadow: inset 0 -2px 4px rgba(120,90,170,.15); }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--m-muted); display: flex; align-items: center; gap: 10px; }
  .group h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(133,124,153,.35), transparent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .tile {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.30));
    -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.8); border-radius: 24px;
    padding: 18px 18px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left;
    cursor: pointer; font: inherit; color: var(--m-ink); min-height: 128px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 1px color-mix(in srgb, var(--c) 10%, transparent),
                0 0 26px -6px color-mix(in srgb, var(--c) 30%, transparent), 0 18px 34px -20px rgba(110,80,150,.45);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .tile::before { content: ""; position: absolute; inset: -40% 40% 55% -20%; background: radial-gradient(closest-side, rgba(255,255,255,.7), transparent); pointer-events: none; }
  .tile::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 28%, transparent), transparent); pointer-events: none; }
  .tile:active { transform: scale(.97); }
  .tile:focus-visible { outline: 3px solid color-mix(in srgb, var(--c) 60%, white); outline-offset: 2px; }
  .tile .ico { position: relative; z-index: 1; width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; line-height: 1;
    background: radial-gradient(circle at 34% 28%, #fff 0 10%, color-mix(in srgb, var(--c) 35%, white) 38%, color-mix(in srgb, var(--c) 70%, white) 72%, var(--c) 100%);
    box-shadow: inset -4px -6px 10px color-mix(in srgb, var(--c) 45%, transparent), inset 3px 4px 8px rgba(255,255,255,.7),
                0 0 22px color-mix(in srgb, var(--c) 45%, transparent), 0 8px 16px -8px color-mix(in srgb, var(--c) 70%, black); }
  .tile .nm { position: relative; z-index: 1; font-family: "Fredoka", var(--font); font-weight: 600; font-size: 20px; line-height: 1.1; }
  .tile .st { position: relative; z-index: 1; font-size: 12.5px; color: var(--m-muted); line-height: 1.45; }
  .tile .en { position: relative; z-index: 1; font-size: 11px; color: color-mix(in srgb, var(--c) 80%, black); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .foot { font-size: 12.5px; color: var(--m-muted); line-height: 1.5; }

  /* ---------- shared game bits ---------- */
  .game { display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .big { font-size: min(34vw, 42vh); line-height: 1; }
  .burst { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 5; }
  .dot { position: absolute; width: 40px; height: 40px; margin: -20px; border-radius: 50%;
         animation: fly .8s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes fly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0} }
  .ring { position: absolute; width: 60px; height: 60px; margin: -30px; border-radius: 50%;
          border: 10px solid rgba(255,255,255,.9); animation: ring .6s ease-out forwards; }
  @keyframes ring { to { transform: scale(5); opacity: 0; } }
  .confetti { position: absolute; width: 16px; height: 26px; top: -30px; animation: drop 1.6s linear forwards; pointer-events: none; z-index: 6; }
  @keyframes drop { to { transform: translateY(120vh) rotate(720deg); } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .pop { animation: pop .5s ease-out; }
  @keyframes pop { 30% { transform: scale(1.3); } }
  #veil { position: absolute; inset: 0; background: var(--dark); opacity: 0; pointer-events: none; transition: opacity 6s linear; z-index: 20; }
  #veil.on { opacity: 1; pointer-events: auto; }
  #exit {
    position: absolute; z-index: 30;
    top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.75); border: 2px solid rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center; font-size: 26px; line-height: 1;
    touch-action: none;
  }
  #exit::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 5px solid var(--b4); border-right-color: transparent; border-bottom-color: transparent; border-left-color: transparent;
    opacity: 0; transform: rotate(0deg);
  }
  #exit.holding::after { opacity: 1; animation: spin 2s linear forwards; }
  @keyframes spin { to { transform: rotate(720deg); } }

  /* 1 풍선 — 단계형 풍선 + 카운터 + 30개 피날레 */
  #g1 { background: linear-gradient(180deg, #BFE6FF 0%, #E4F4FF 55%, #FFF4EA 100%); overflow: hidden; }
  #g1 .bp-clouds, #g1 .bp-balloons, #g1 .bp-fx { position: absolute; inset: 0; }
  #g1 .bp-fx { pointer-events: none; z-index: 10; }
  .bp-cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .75; filter: blur(1px); }
  .bp-cloud::before, .bp-cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .bp-cloud::before { width: 55%; height: 150%; left: 15%; top: -70%; }
  .bp-cloud::after { width: 40%; height: 120%; right: 12%; top: -45%; }
  @keyframes bpDrift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  #g1 .bp-hill { position: absolute; left: -10%; right: -10%; bottom: 0; height: 24%; transform: translateX(6%);
                 background: linear-gradient(180deg, #C9F0BE, #A9E3A4); border-radius: 50% 50% 0 0 / 60px 60px 0 0; }
  #g1 .bp-ground { position: absolute; left: -5%; right: -5%; bottom: 0; height: 18%;
                   background: linear-gradient(180deg, #9BE0A2 0%, #7FD08F 60%, #6CC283 100%);
                   border-radius: 50% 50% 0 0 / 34px 34px 0 0; box-shadow: inset 0 6px 0 rgba(255,255,255,.35); }
  .bp-flower { position: absolute; line-height: 1; pointer-events: none; }
  #g1 .bp-cart { position: absolute; left: 0; top: 0; will-change: transform; }
  .bp-cart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bp-sq { transform-box: fill-box; transform-origin: 50% 100%; }
  .bp-puff { position: absolute; border-radius: 50%; background: #fff; will-change: transform, opacity; }
  .bp-balloon { position: absolute; left: 0; top: 0; will-change: transform; }
  .bp-balloon svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bp-bx { transform-origin: 50% 38%; animation: bpWobble 2.4s ease-in-out infinite alternate; }
  @keyframes bpWobble { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .bp-eyes-happy { display: none; }
  .bp-happy .bp-eyes-open { display: none; }
  .bp-happy .bp-eyes-happy { display: inline; }
  .bp-p { position: absolute; left: 0; top: 0; line-height: 1; font-weight: 900; will-change: transform, opacity; }
  .bp-ring { position: absolute; border-radius: 50%; border: 5px solid; will-change: transform, opacity; }
  .bp-word { position: absolute; font-weight: 900; white-space: nowrap; letter-spacing: .5px; font-family: "Avenir Next", var(--font);
             -webkit-text-stroke: 2px #fff; paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .bp-counter { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
                z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; }
  .bp-pill { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 6px 24px 6px 16px;
             box-shadow: 0 6px 18px rgba(80,120,180,.18); }
  .bp-icon { font-size: clamp(26px, 4.2vw, 40px); display: inline-block; }
  .bp-num { font-family: "Avenir Next", var(--font); font-weight: 900; font-size: clamp(32px, 5.4vw, 54px); min-width: 1.3em;
            text-align: center; color: #FF6F9F; display: inline-block; line-height: 1.1; }
  .bp-bar { width: clamp(150px, 24vw, 260px); height: 12px; background: rgba(255,255,255,.75); border-radius: 99px; overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,.06); }
  .bp-fill { height: 100%; width: 0; background: linear-gradient(90deg, #FFB84D, #FF8FB8, #A77BF0); border-radius: 99px;
             transition: width .4s cubic-bezier(.3,1.6,.5,1); }
  .bp-banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%) scale(0); z-index: 6;
               padding: 14px 30px; border-radius: 999px; background: #fff; font-family: "Avenir Next", var(--font); font-weight: 900;
               font-size: clamp(24px, 4.4vw, 42px); box-shadow: 0 8px 24px rgba(80,120,180,.18); white-space: nowrap; pointer-events: none; }
  .bp-bunch { position: absolute; left: 0; top: 0; will-change: transform; z-index: 3; }
  .bp-bunch .bp-str { display: none; }
  .bp-bunch svg.bp-lines { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .bp-bow { position: absolute; transform: translate(-50%,-30%); pointer-events: none; line-height: 1; }
  .bp-end { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px;
            z-index: 8; background: rgba(255,255,255,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .bp-title { font-family: "Avenir Next", var(--font); font-weight: 900; font-size: clamp(40px, 7.5vw, 78px); color: #FF6F9F;
              -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 5px 0 rgba(224,79,130,.18); text-align: center; }
  .bp-count { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 999px; padding: 10px 34px;
              font-family: "Avenir Next", var(--font); font-weight: 900; font-size: clamp(36px, 6vw, 60px); box-shadow: 0 8px 24px rgba(80,120,180,.18); }
  .bp-again { border: 0; border-radius: 999px; padding: 24px 52px; font-family: "Avenir Next", var(--font); font-weight: 900;
              font-size: clamp(28px, 5vw, 46px); color: #fff; background: linear-gradient(180deg, #FF9EC2, #FF6F9F);
              box-shadow: 0 10px 0 #E04F82, 0 18px 30px rgba(224,79,130,.3); animation: bpBreathe 1.6s ease-in-out infinite; }
  @keyframes bpBreathe { 50% { transform: scale(1.06); } }

  /* 2 큰 피아노 — 장난감 피아노 건반 네 개 */
  #g2 { display: flex; background: #2b2340; gap: 1.2vw; padding: 3vh 1.2vw 0; box-sizing: border-box; align-items: stretch; }
  .pad { flex: 1; position: relative; background: #fffdf7; border-radius: 0 0 4vmin 4vmin;
         box-shadow: inset 0 -2.2vh 0 rgba(0,0,0,.08), 0 1vh 0 rgba(0,0,0,.35); transition: transform .08s, background .08s; }
  .pad::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 7vh; height: 3.5vh; border-radius: 2vh; background: var(--k); opacity: .9; }
  .pad.lit { background: color-mix(in srgb, var(--k) 45%, white); transform: translateY(1vh); box-shadow: inset 0 -1vh 0 rgba(0,0,0,.1), 0 0 0 rgba(0,0,0,0); }

  /* 0 쎄쎄쎄 */
  #g0 { background: #fff3c4; }
  #hands { width: min(80vw, 70vh); max-width: 100%; height: auto; display: block; }
  .hand { transform-origin: 50% 90%; transition: transform .12s ease-out; }
  .hand.left  { transform: translateX(-120px) rotate(-18deg); }
  .hand.right { transform: translateX(120px) rotate(18deg); }
  #hands.clap .hand.left  { transform: translateX(-10px) rotate(-4deg); }
  #hands.clap .hand.right { transform: translateX(10px) rotate(4deg); }
  #hands.clap { animation: shake .25s ease-out; }
  @keyframes shake { 0%{transform:scale(1)} 40%{transform:scale(1.08)} 100%{transform:scale(1)} }

  /* 3·4 두 개 중 고르기 — 위는 작게, 아래 선택지가 화면을 지배 */
  .choose { flex-direction: column; }
  .target { flex: 0 0 22%; display: flex; align-items: center; justify-content: center; gap: 4vw; width: 100%; background: rgba(255,255,255,.55); }
  .tpic { font-size: min(13vw, 16vh); line-height: 1; }
  .tspk { font-size: min(5vw, 6vh); line-height: 1; opacity: .55; }
  .target.say .tspk { animation: pulse .6s ease-in-out 2; opacity: 1; }
  .options { flex: 1; display: flex; width: 100%; gap: 3vw; padding: 2vh 3vw 3vh; box-sizing: border-box; }
  .opt { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; font-size: min(30vw, 40vh);
         border-radius: 5vmin; border: 1.2vmin solid rgba(0,0,0,.08); }
  .opt:first-child { background: #ffe9e9; } .opt:last-child { background: #e6f1ff; }
  .options.hint .opt { animation: nudge 1.6s ease-in-out infinite; }
  .options.hint .opt:last-child { animation-delay: .8s; }
  @keyframes nudge { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,200,61,0); } 50% { transform: scale(1.04); box-shadow: 0 0 0 1.5vmin rgba(255,200,61,.55); } }
  .options.hint .opt::after { content: "👆"; position: absolute; bottom: 3vh; left: 50%; font-size: min(10vw, 11vh); line-height: 1;
         transform: translateX(-50%); animation: tapbounce 1.6s ease-in-out infinite; }
  .options.hint .opt:last-child::after { animation-delay: .8s; }
  @keyframes tapbounce { 0%,100% { transform: translateX(-50%) translateY(0); opacity: .35; } 50% { transform: translateX(-50%) translateY(-2.5vh); opacity: 1; } }

  /* 6 하나씩 담기 */
  #g6 { background: #fff9ea; gap: 4vw; flex-wrap: wrap; padding: 4vw; box-sizing: border-box; }
  .plate { width: 26vmin; height: 26vmin; border-radius: 50%; background: #fff; border: 8px solid #d9c9a3; display: flex; align-items: center; justify-content: center; font-size: 15vmin; }
  .plate.full { border-color: var(--b3); }

  /* 7 쌓기 */
  #g7 { background: linear-gradient(#e8f6ff, #fdf6dc); }
  #stack { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; padding-bottom: 6vh; box-sizing: border-box; }
  .block { width: 40vmin; height: 8vh; border-radius: 10px; border: 3px solid rgba(0,0,0,.15); box-sizing: border-box; animation: pop .4s ease-out; }
  #digit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Fredoka", var(--font); font-weight: 700; font-size: min(60vw, 75vh); line-height: 1; }
  #items { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); align-items: center; justify-items: center; padding: 6vh 4vw; box-sizing: border-box; }
  #items span { font-size: min(14vw, 24vh); line-height: 1; animation: pop .4s ease-out; }

  /* 9 내 이름 */
  #g9 { background: #fff0f6; }

<script>
(function () {
  // ---------- 설정 (사진·녹음 교체 시 여기만 바꿉니다) ----------
  var LANG = 'en-US';                 // 아이에게 들리는 언어. 한국어로 바꾸려면 'ko-KR'
  var CHILD_NAME = 'Ella';
  var PRAISE = 'Great job!';
  var ITEMS = [
    { word: 'apple', pic: '🍎' }, { word: 'banana', pic: '🍌' }, { word: 'milk', pic: '🥛' },
    { word: 'ball', pic: '⚽' }, { word: 'car', pic: '🚗' }, { word: 'dog', pic: '🐶' }
  ];
  var NUMS = ['one','two','three','four','five','six','seven','eight','nine','ten'];
  var SESSION_MS = 3 * 60 * 1000, COOLDOWN_MS = 180;
  var COLORS = ['--b1','--b2','--b3','--b4','--b5','--b6'];

  // ---------- 공통 ----------
  var audioCtx = null, lastHit = 0, started = 0, ended = false, current = null, timers = [];
  var screens = {}; ['menu','g0','g1','g2','g3','g6','g7','g9','g10'].forEach(function (id) { screens[id] = document.getElementById(id); });
  var veil = document.getElementById('veil'), exitPad = document.getElementById('exit');

  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(arr, not) { var x; do { x = arr[rnd(arr.length)]; } while (arr.length > 1 && x === not); return x; }
  function cssVar(i) { return 'var(' + COLORS[i % COLORS.length] + ')'; }

  // iOS는 홈 화면 전환·전화·다른 앱 소리 뒤에 오디오를 'interrupted'/'suspended'로 멈춰 둠. 매번 running이 아니면 깨움.
  var master = null;
  function ctx() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        master = audioCtx.createGain(); master.gain.value = 1; master.connect(audioCtx.destination);
      }
      if (audioCtx.state !== 'running') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && audioCtx) ctx(); });
  function unlockAudio() {
    var c = ctx();
    if (c) { try { var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(master); s.start(0); } catch (e) {} }
    try {
      if ('speechSynthesis' in window) { speechSynthesis.resume(); var u = new SpeechSynthesisUtterance(' '); u.volume = 0.01; u.lang = LANG; speechSynthesis.speak(u); }
    } catch (e) {}
  }
  function noise(dur, freq, q, vol, t0) {
    var c = ctx(); if (!c) return;
    var len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    var g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(c.currentTime + (t0 || 0));
  }
  function popSound() { noise(0.12, 1800, 0.8, 1.4, 0); }                 // 손뼉·톡 소리
  function bang() {                                                        // 풍선 '팡': 낮은 펑 + 터지는 파열음
    var c = ctx(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(420 + Math.random() * 120, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
    g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
    noise(0.16, 2600, 0.5, 1.6, 0);
  }
  function tone(freq, t0, dur, vol) {
    var c = ctx(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.7, c.currentTime + t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g); g.connect(master); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
  }
  function blip() { tone(660, 0, 0.15, 0.5); }
  function jingle() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.12, 0.35); }); }

  // 기기 기본 음성이 낮고 거친 남성 음성인 경우가 많아, 아이에게 맞는 음성을 이름으로 우선 고릅니다.
  var PREFERRED = {
    en: ['Ava', 'Samantha', 'Karen', 'Moira', 'Tessa', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Allison', 'Susan', 'Zoe', 'Nicky'],
    ko: ['Yuna', 'Google 한국의', 'Microsoft SunHi', 'Microsoft Heami', 'Sora', 'Jian']
  };
  var AVOID = /fred|albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|organ|trinoids|whisper|wobble|zarvox|junior|ralph|rocko|grandpa|grandma|eddy|flo|reed|sandy|shelley|hysterical|superstar/i;
  var voiceCache = {};
  function pickVoice(lang) {
    if (voiceCache[lang]) return voiceCache[lang];
    var all = speechSynthesis.getVoices(); if (!all.length) return null;
    var key = lang.slice(0, 2), prefs = PREFERRED[key] || [];
    var same = all.filter(function (v) { return v.lang.replace('_', '-').toLowerCase().indexOf(key) === 0; });
    // 1) 기기 설정에서 사용자가 고른 기본 음성을 먼저 존중 (이상한 특수 음성만 제외)
    var v = same.filter(function (x) { return x.default && !AVOID.test(x.name); })[0];
    // 2) 없으면 이름 목록 순서로. 같은 이름이 여러 개면 '향상된/프리미엄' 버전 우선
    for (var i = 0; i < prefs.length && !v; i++) {
      var c = same.filter(function (x) { return x.name.indexOf(prefs[i]) === 0; });
      c.sort(function (a, b) { return /premium|enhanced|향상|프리미엄/i.test(b.name) - /premium|enhanced|향상|프리미엄/i.test(a.name); });
      v = c[0];
    }
    if (!v) v = same.filter(function (x) { return !AVOID.test(x.name) && x.lang.toLowerCase() === lang.toLowerCase(); })[0];
    if (!v) v = same.filter(function (x) { return !AVOID.test(x.name); })[0];
    if (v) voiceCache[lang] = v;
    return v;
  }
  try { speechSynthesis.onvoiceschanged = function () { voiceCache = {}; }; } catch (e) {}

  // cancel() 직후 같은 틱에 speak()하면 Safari·Chrome 모두 말을 삼키는 일이 잦음 → 잠깐 뒤에 말함.
  var speakSeq = 0;
  function speak(text, rate, lang) {
    try {
      if (!('speechSynthesis' in window)) return;
      var my = ++speakSeq;
      if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      setTimeout(function () {
        if (my !== speakSeq) return;                   // 더 새 말이 들어왔으면 이건 버림
        try {
          speechSynthesis.resume();                      // Chrome이 멈춰 둔 상태 해제
          var u = new SpeechSynthesisUtterance(text);
          u.lang = lang || LANG; u.rate = rate || 0.9; u.pitch = 1.1; u.volume = 1;
          var v = pickVoice(u.lang); if (v) u.voice = v;
          speechSynthesis.speak(u);
        } catch (e) {}
      }, 60);
    } catch (e) {}
  }

  function burst(parent, x, y) {
    var b = document.createElement('div'); b.className = 'burst'; b.style.left = x + 'px'; b.style.top = y + 'px';
    var r = document.createElement('div'); r.className = 'ring'; b.appendChild(r);
    for (var i = 0; i < 14; i++) {
      var d = document.createElement('div'); d.className = 'dot';
      var a = Math.random() * Math.PI * 2, rad = 120 + Math.random() * 180;
      d.style.background = cssVar(i);
      d.style.setProperty('--dx', Math.cos(a) * rad + 'px'); d.style.setProperty('--dy', Math.sin(a) * rad + 'px');
      b.appendChild(d);
    }
    parent.appendChild(b); later(function () { b.remove(); }, 900);
  }
  function reward(parent) {
    jingle(); later(function () { speak(PRAISE, 1); }, 350);
    for (var i = 0; i < 40; i++) {
      var c = document.createElement('div'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%'; c.style.background = cssVar(i);
      c.style.animationDelay = Math.random() * 0.5 + 's';
      parent.appendChild(c); (function (el) { later(function () { el.remove(); }, 2300); })(c);
    }
  }
  function gate() {               // 손바닥 다중 터치를 한 번으로 묶음
    if (ended) return false;
    var now = Date.now(); if (now - lastHit < COOLDOWN_MS) return false; lastHit = now;
    if (!started) { started = now; later(finish, SESSION_MS); }
    return true;
  }

  function show(id) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== id); });
    exitPad.hidden = (id === 'menu');
  }
  function start(id) {
    clearTimers(); started = 0; ended = false; lastHit = 0; current = id;
    veil.classList.remove('on'); show(id);
    if (games[id]) games[id]();
  }
  function finish() {
    if (current === 'g1' && BP.sessionEnd()) return;   // 풍선 게임은 피날레로 마무리
    finishNow();
  }
  function finishNow() {
    ended = true; try { speechSynthesis.cancel(); } catch (e) {}
    veil.classList.add('on');
    later(function () { backToMenu(); }, 9000);
  }
  function backToMenu() {
    clearTimers(); ended = false; started = 0; current = null;
    try { speechSynthesis.cancel(); } catch (e) {}
    Object.keys(screens).forEach(function (k) { if (k !== 'menu') screens[k].querySelectorAll('.burst,.confetti,.balloon').forEach(function (n) { n.remove(); }); });
    veil.classList.remove('on'); show('menu');
  }

  var games = {};

  // ---------- 0 쎄쎄쎄 ----------
  // 노래 소절 자리표시. 녹음 파일을 받으면 오디오 클립으로 교체. 노래가 한국어라 이 게임만 한국어 음성.
  var PHRASES = ['쎄쎄쎄', '짝', '짝짝', '쎄쎄쎄'], phraseIdx = 0;
  games.g0 = function () { phraseIdx = 0; };
  screens.g0.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (!gate()) return;
    var hands = document.getElementById('hands');
    hands.classList.remove('clap'); void hands.offsetWidth; hands.classList.add('clap');
    later(function () { hands.classList.remove('clap'); }, 260);
    popSound(); burst(screens.g0, e.clientX, e.clientY);
    later(function () { speak(PHRASES[phraseIdx % PHRASES.length], 1, 'ko-KR'); phraseIdx++; }, 120);
  });

  // ---------- 1 풍선 (단계형 풍선 + 카운터 + 30개 피날레) ----------
  // 터트린 개수 기준으로 단계가 올라감: 흰·파랑 → 색깔·무지개 → 메탈릭 포일 → 하트 → 강아지.
  // 30개를 터트리면(또는 3분 세션이 끝나면) 지금까지 터트린 풍선이 한 다발로 올라오는 피날레.
  var BP = (function () {
    const root = screens.g1;
    const layer = root.querySelector('.bp-balloons'), fx = root.querySelector('.bp-fx');
    const $ = (s) => root.querySelector(s);

    const GOAL = 30;
    const STAGES = [
      { at: 0,  pool: { white: 5, blue: 5 } },
      { at: 6,  pool: { white: 3, blue: 3, pink: 2, orange: 2, rainbow: 1 } },
      { at: 12, pool: { white: 3, blue: 3, pink: 2, orange: 2, rainbow: 1, foilGold: .8, foilPink: .8, foilSilver: .8 } },
      { at: 18, pool: { white: 2, blue: 2, pink: 2, orange: 2, rainbow: 1, foilGold: .7, foilPink: .7, foilSilver: .7, heart: 2.5 } },
      { at: 24, pool: { white: 2, blue: 2, pink: 2, orange: 2, rainbow: 1, foilGold: .6, foilPink: .6, foilSilver: .6, heart: 2, dog: 2 } }
    ];
    const SPEED = { launch: 558, from: 99, to: 171 };   // 쏘아 올리는 힘 → 떠오르는 속도(px/초). 30개까지 점점 빨라짐
    const SPAWN = { from: 1150, to: 650 };               // 풍선 사이 간격 ms
    const MAX_ON_SCREEN = 7;
    const FINALE_SECONDS = 11;

    const TYPES = {
      white:     { shape: 'round',  fill: 'plain',   c: ['#FFFFFF','#FFFFFF','#CDD6E4'], str: '#B9C2CF', fx: ['#9CC8FF','#FFB3CF','#FFD966'] },
      blue:      { shape: 'round',  fill: 'plain',   c: ['#B7DCFF','#5AA9F5','#2B66B8'], str: '#7FA6CF', fx: ['#5AA9F5','#9FD3FF','#FFD966'] },
      pink:      { shape: 'round',  fill: 'plain',   c: ['#FFD0E1','#FF8FB8','#D9467A'], str: '#E79AB6', fx: ['#FF8FB8','#FFC4DA','#FFD966'] },
      orange:    { shape: 'round',  fill: 'plain',   c: ['#FFE0B5','#FFA94D','#D9700A'], str: '#E6B17A', fx: ['#FFA94D','#FFD39E','#FF8FB8'] },
      rainbow:   { shape: 'round',  fill: 'rainbow', c: ['#FFF','#FF8FB8','#7A5BD6'], str: '#C3B4E6', fx: ['#FF6B6B','#FFB84D','#FFE14D','#6BD48A','#5AA9F5','#A77BF0'], special: true },
      foilGold:  { shape: 'star',   fill: 'foil', foil: 'gold',   str: '#D4B25A', fx: ['#FFD54A','#FFF2A8','#FFB84D'], special: true, rare: true },
      foilPink:  { shape: 'flower', fill: 'foil', foil: 'pink',   str: '#E7A1BE', fx: ['#FF8FB8','#FFD0E1','#FFD54A'], special: true, rare: true },
      foilSilver:{ shape: 'round',  fill: 'foil', foil: 'silver', str: '#AEB6C2', fx: ['#C9D3E0','#9CC8FF','#FFD0E1'], special: true, rare: true },
      heart:     { shape: 'heart',  fill: 'plain',   c: ['#FFC2CC','#FF6B81','#CF3550'], str: '#E79AA6', fx: ['#FF6B81','#FFB0BC','#FFD966'], special: true },
      dog:       { shape: 'dog',    fill: 'plain',   c: ['#C7E6FF','#4F9BF2','#2059B0'], str: 'none',    fx: ['#4F9BF2','#9FD3FF','#FFD966','#FF8FB8'], special: true, rare: true }
    };
    const FOILS = {
      gold:   ['#FFF7CF','#F2C230','#A9790A','#FFE57A','#C4900F','#FFF3B5','#9C6C05'],
      pink:   ['#FFE6F0','#F37AAA','#B83A6E','#FFC3DA','#D9568B','#FFE0EC','#A52E5E'],
      silver: ['#FFFFFF','#C9D1DC','#7E8896','#F1F4F8','#9AA4B2','#FFFFFF','#6F7986']
    };

    // ----- 그림 (SVG) -----
    let uid = 0;
    function face(cx, cy, s) {
      const L = cx - 14 * s, R = cx + 14 * s;
      const happy = (x) => `M${x - 5.5 * s} ${cy + 1.5 * s} Q${x} ${cy - 6.5 * s} ${x + 5.5 * s} ${cy + 1.5 * s}`;
      return `<g>
        <ellipse cx="${cx - 22 * s}" cy="${cy + 11 * s}" rx="${7 * s}" ry="${4.5 * s}" fill="#FF7B9C" opacity=".45"/>
        <ellipse cx="${cx + 22 * s}" cy="${cy + 11 * s}" rx="${7 * s}" ry="${4.5 * s}" fill="#FF7B9C" opacity=".45"/>
        <g class="bp-eyes-open">
          <circle cx="${L}" cy="${cy}" r="${5.5 * s}" fill="#3B2B2B"/><circle cx="${L + 1.8 * s}" cy="${cy - 2 * s}" r="${1.9 * s}" fill="#fff"/>
          <circle cx="${R}" cy="${cy}" r="${5.5 * s}" fill="#3B2B2B"/><circle cx="${R + 1.8 * s}" cy="${cy - 2 * s}" r="${1.9 * s}" fill="#fff"/>
        </g>
        <g class="bp-eyes-happy" fill="none" stroke="#3B2B2B" stroke-width="${3.4 * s}" stroke-linecap="round"><path d="${happy(L)}"/><path d="${happy(R)}"/></g>
        <path d="M${cx - 9 * s} ${cy + 10 * s} Q${cx} ${cy + 19 * s} ${cx + 9 * s} ${cy + 10 * s}" fill="none" stroke="#3B2B2B" stroke-width="${3.4 * s}" stroke-linecap="round"/>
      </g>`;
    }
    function paintDefs(t, id, box) {
      const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0, r = Math.max(w, h) * .78;
      if (t.fill === 'plain') {
        return `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${x0 + w * .36}" cy="${y0 + h * .3}" r="${r}">
          <stop offset="0" stop-color="${t.c[0]}"/><stop offset=".45" stop-color="${t.c[1]}"/><stop offset="1" stop-color="${t.c[2]}"/></radialGradient>`;
      }
      if (t.fill === 'rainbow') {
        return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}">
          <stop offset="0" stop-color="#FF6B6B"/><stop offset=".2" stop-color="#FFB84D"/><stop offset=".4" stop-color="#FFE14D"/>
          <stop offset=".6" stop-color="#6BD48A"/><stop offset=".8" stop-color="#5AA9F5"/><stop offset="1" stop-color="#A77BF0"/></linearGradient>
          <radialGradient id="${id}s" gradientUnits="userSpaceOnUse" cx="${x0 + w * .36}" cy="${y0 + h * .3}" r="${r}">
          <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2a1a4a" stop-opacity=".28"/></radialGradient>`;
      }
      const f = FOILS[t.foil];
      return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}">
        ${f.map((c, i) => `<stop offset="${(i / (f.length - 1)).toFixed(3)}" stop-color="${c}"/>`).join('')}</linearGradient>
        <linearGradient id="${id}s" gradientUnits="userSpaceOnUse" x1="${x0}" y1="${y1}" x2="${x1}" y2="${y0}">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
    }
    function svgFor(type) {
      const t = TYPES[type], id = 'bpg' + (++uid);
      const F = `url(#${id})`, S = `url(#${id}s)`;
      const str = (y) => t.str === 'none' ? '' :
        `<path class="bp-str" d="M60 ${y} q -9 14 0 28 q 9 14 0 28" fill="none" stroke="${t.str}" stroke-width="1.8" stroke-linecap="round"/>`;
      const hl = (x, y, rx, ry, rot) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="#fff" opacity=".75"/>`;
      let body = '', vb = '0 0 120 186';
      const knotC = t.c ? t.c[2] : '#999';
      if (t.shape === 'round') {
        const p = 'M60 6 C94 6 112 32 112 62 C112 94 86 118 60 122 C34 118 8 94 8 62 C8 32 26 6 60 6 Z';
        const foil = t.fill === 'foil';
        body = `<defs>${paintDefs(t, id, [8, 6, 112, 122])}</defs>${str(foil ? 110 : 128)}
          ${foil ? '' : `<path d="M53 130 L67 130 L60 120 Z" fill="${knotC}"/>`}
          <path d="${p}" fill="${F}" ${foil ? 'stroke="rgba(0,0,0,.12)" stroke-width="1.5"' : ''}/>
          ${t.fill !== 'plain' ? `<path d="${p}" fill="${S}"/>` : ''}
          ${hl(38, 34, 9, 16, -28)}<circle cx="34" cy="58" r="3.2" fill="#fff" opacity=".7"/>${face(60, 64, 1)}`;
      } else if (t.shape === 'heart') {
        const p = 'M60 116 C22 90 8 64 8 42 C8 20 24 8 41 8 C51 8 57 14 60 22 C63 14 69 8 79 8 C96 8 112 20 112 42 C112 64 98 90 60 116 Z';
        body = `<defs>${paintDefs(t, id, [8, 8, 112, 116])}</defs>${str(124)}
          <path d="M53 126 L67 126 L60 116 Z" fill="${knotC}"/><path d="${p}" fill="${F}"/>
          ${hl(30, 30, 8, 13, -35)}<circle cx="26" cy="52" r="3" fill="#fff" opacity=".7"/>${face(60, 52, 1)}`;
      } else if (t.shape === 'star') {
        const pts = [];
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 23 : 46; pts.push((60 + r * Math.cos(a)).toFixed(1) + ',' + (64 + r * Math.sin(a)).toFixed(1)); }
        const poly = pts.join(' ');
        body = `<defs>${paintDefs(t, id, [6, 10, 114, 118])}</defs>${str(104)}
          <polygon points="${poly}" fill="${F}" stroke="${F}" stroke-width="18" stroke-linejoin="round"/>
          <polygon points="${poly}" fill="${S}" stroke="${S}" stroke-width="18" stroke-linejoin="round"/>
          ${hl(44, 40, 6, 12, -30)}${face(60, 68, .95)}`;
      } else if (t.shape === 'flower') {
        let petals = '';
        for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; petals += `<circle cx="${(60 + 30 * Math.cos(a)).toFixed(1)}" cy="${(62 + 30 * Math.sin(a)).toFixed(1)}" r="27"/>`; }
        const g = (fill) => `<g fill="${fill}">${petals}<circle cx="60" cy="62" r="30"/></g>`;
        body = `<defs>${paintDefs(t, id, [3, 5, 117, 119])}</defs>${str(108)}${g(F)}${g(S)}${hl(46, 26, 6, 11, -30)}${face(60, 64, .95)}`;
      } else {  // dog
        vb = '0 0 168 140';
        const dark = `url(#${id}d)`;
        const e = (cx, cy, rx, ry, rot = 0, fill = F) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="${fill}"/>`;
        body = `<defs>${paintDefs(t, id, [0, 0, 168, 140])}
          <radialGradient id="${id}d" gradientUnits="userSpaceOnUse" cx="60" cy="40" r="150"><stop offset="0" stop-color="${t.c[1]}"/><stop offset="1" stop-color="${t.c[2]}"/></radialGradient></defs>
          ${e(80, 104, 9, 23, 4, dark)}${e(120, 104, 9, 23, -4, dark)}${e(60, 20, 8, 15, 16, dark)}
          ${e(146, 56, 7, 16, 25)}${e(104, 76, 37, 14)}${e(66, 106, 10, 24, -3)}${e(134, 106, 10, 24, 3)}
          ${e(64, 62, 11, 18, 18)}${e(48, 18, 8, 15, -12)}${e(24, 46, 20, 11)}${e(52, 40, 16, 15)}
          ${hl(100, 68, 13, 3.5, -3)}${hl(46, 32, 4, 6, -30)}${hl(18, 42, 6, 3, -8)}${face(52, 42, .5)}`;
      }
      return { html: `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`, aspect: t.shape === 'dog' ? 168 / 140 : 120 / 186 };
    }

    // ----- 상태 -----
    let balloons = [], byEl = new Map(), pops = 0, shown = 0, history = [], stageIdx = 0, sinceSpawn = 0;
    let mode = 'idle';             // idle | play | finale-intro | finale | end
    let bunch = null, sessionOver = false, rafId = null, last = 0;

    const vmin = () => Math.min(innerWidth, innerHeight);
    const baseW = () => Math.max(84, Math.min(150, vmin() * 0.17));
    const ramp = () => Math.min(1, pops / GOAL);
    const speed = () => SPEED.from + (SPEED.to - SPEED.from) * ramp();
    const spawnGap = () => SPAWN.from + (SPAWN.to - SPAWN.from) * ramp();

    function weightedPick(pool, exclude) {
      const entries = Object.entries(pool).filter(([k]) => !exclude || !exclude(k));
      let r = Math.random() * entries.reduce((s, [, w]) => s + w, 0);
      for (const [k, w] of entries) { if ((r -= w) <= 0) return k; }
      return entries[0][0];
    }
    function pickType() {
      const rareOnScreen = balloons.some(b => !b.popping && TYPES[b.type].rare);
      return weightedPick(STAGES[stageIdx].pool, k => rareOnScreen && TYPES[k].rare);
    }
    function makeBalloonEl(type, w) {
      const { html, aspect } = svgFor(type);
      const el = document.createElement('div');
      el.className = 'bp-balloon'; el.style.width = w + 'px';
      el.innerHTML = `<div class="bp-bx" style="animation-delay:${(-Math.random() * 2.4).toFixed(2)}s">${html}</div>`;
      return { el, h: w / aspect };
    }
    // ----- 풍선차: 굴러 들어와 멈춘 뒤 구멍 3개에서 풍선을 쏘아 올림 -----
    const TUBES = [
      { x: 112, a: -16, c: ['#FFF6C8','#FFD54A','#D9A21A'] },
      { x: 200, a: 0,   c: ['#DDFFF1','#6BDDB0','#2FA57A'] },
      { x: 288, a: 16,  c: ['#F1E8FF','#B79BFF','#7A5BD6'] }
    ];
    const WHEELS = [{ x: 112, y: 214 }, { x: 288, y: 214 }];
    function cartSVG() {
      const grad = (id, c, x0, y0, x1, y1) => `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${x0 + (x1 - x0) * .32}" cy="${y0 + (y1 - y0) * .25}" r="${Math.max(x1 - x0, y1 - y0) * .85}">
        <stop offset="0" stop-color="${c[0]}"/><stop offset=".5" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient>`;
      let defs = grad('bpcBody', ['#FFE3EE','#FF9EC4','#DE5E93'], 28, 90, 372, 212);
      TUBES.forEach((t, i) => { defs += grad('bpcT' + i, t.c, t.x - 30, 34, t.x + 30, 104); });
      defs += `<radialGradient id="bpcHub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE9D2"/></radialGradient>
        <radialGradient id="bpcTire" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#9B6FA0"/><stop offset="1" stop-color="#5E3D63"/></radialGradient>
        <clipPath id="bpcClip"><rect x="28" y="92" width="344" height="118" rx="46"/></clipPath>`;
      const tubes = TUBES.map((t, i) => `
        <g transform="rotate(${t.a} ${t.x} 100)"><g class="bp-sq" id="bpcTube${i}">
          <rect x="${t.x - 27}" y="40" width="54" height="64" rx="14" fill="url(#bpcT${i})"/>
          <rect x="${t.x - 18}" y="50" width="9" height="40" rx="4.5" fill="#fff" opacity=".55"/>
          <ellipse cx="${t.x}" cy="41" rx="31" ry="11" fill="${t.c[0]}"/>
          <ellipse cx="${t.x}" cy="41" rx="31" ry="11" fill="none" stroke="${t.c[2]}" stroke-opacity=".35" stroke-width="2"/>
          <ellipse cx="${t.x}" cy="42" rx="20" ry="6.5" fill="#5B3A55"/>
          <ellipse cx="${t.x}" cy="43.5" rx="13" ry="3.2" fill="#3B2338"/>
        </g></g>`).join('');
      let dots = ''; for (let x = 58; x <= 350; x += 36) dots += `<circle cx="${x}" cy="194" r="5" fill="#fff" opacity=".55"/>`;
      const wheel = (w, i) => {
        let spokes = '';
        for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; spokes += `<line x1="${w.x}" y1="${w.y}" x2="${(w.x + Math.cos(a) * 24).toFixed(1)}" y2="${(w.y + Math.sin(a) * 24).toFixed(1)}" stroke="${k % 2 ? '#FF8FB8' : '#7FC8FF'}" stroke-width="7" stroke-linecap="round"/>`; }
        return `<g id="bpcWheel${i}"><circle cx="${w.x}" cy="${w.y}" r="40" fill="url(#bpcTire)"/><circle cx="${w.x}" cy="${w.y}" r="30" fill="url(#bpcHub)"/>${spokes}
          <circle cx="${w.x}" cy="${w.y}" r="9" fill="#FFC23A"/><circle cx="${w.x - 3}" cy="${w.y - 3}" r="3" fill="#fff" opacity=".8"/></g>
          <path d="M${w.x - 30} ${w.y - 22} A37 37 0 0 1 ${w.x + 6} ${w.y - 36}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>`;
      };
      return `<svg viewBox="0 0 400 270" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>
        <ellipse cx="200" cy="257" rx="160" ry="11" fill="rgba(40,90,40,.22)"/>
        <g class="bp-sq" id="bpcTop">${tubes}
          <rect x="44" y="84" width="312" height="20" rx="10" fill="#FFF3E2"/><rect x="44" y="84" width="312" height="7" rx="3.5" fill="#fff" opacity=".8"/>
          <rect x="28" y="92" width="344" height="118" rx="46" fill="url(#bpcBody)"/>
          <g clip-path="url(#bpcClip)"><rect x="20" y="182" width="360" height="24" fill="#FFF0F6" opacity=".9"/>${dots}</g>
          <ellipse cx="86" cy="113" rx="34" ry="9" transform="rotate(-8 86 113)" fill="#fff" opacity=".7"/>
          <circle cx="56" cy="134" r="4" fill="#fff" opacity=".7"/>
          <circle cx="366" cy="150" r="9" fill="#FFE27A"/><circle cx="364" cy="147" r="3" fill="#fff"/>
          ${face(200, 136, 1.45)}
        </g>${WHEELS.map(wheel).join('')}</svg>`;
    }
    const cartEl = root.querySelector('.bp-cart');
    cartEl.innerHTML = cartSVG();
    const cartSvg = cartEl.querySelector('svg');
    let cw = 0, ck = 1, cartX = 0, cartY = 0, wheelAngle = 0, cartState = 'away', arriveT = 0, arriveFrom = 0, lastTube = -1;
    const arriveTo = () => innerWidth / 2 - cw / 2;
    function layoutCart() {
      cw = Math.max(260, Math.min(520, innerWidth * .46, innerHeight * .62)); ck = cw / 400;
      cartEl.style.width = cw + 'px';
      const gh = innerHeight * .18;
      cartY = innerHeight - gh + gh * .42 - 257 * ck;
      if (cartState === 'ready') { cartX = arriveTo(); placeCart(0); }
    }
    function placeCart(bob) { cartEl.style.transform = `translate(${cartX}px, ${cartY + bob}px)`; }
    function spinWheels() { WHEELS.forEach((w, i) => cartSvg.querySelector('#bpcWheel' + i).setAttribute('transform', `rotate(${wheelAngle} ${w.x} ${w.y})`)); }
    function cartArrive() { cartState = 'away'; layoutCart(); cartState = 'arriving'; arriveT = 0; arriveFrom = -cw - 60; cartX = arriveFrom; placeCart(0); }
    function cartJiggle(sx, sy, ms) {
      cartSvg.querySelector('#bpcTop').animate([{ transform: 'scale(1,1)' }, { transform: `scale(${sx},${sy})`, offset: .3 },
        { transform: `scale(${2 - sx},${2 - sy})`, offset: .6 }, { transform: 'scale(1,1)' }], { duration: ms, easing: 'ease-out' });
    }
    function holePoint(i) {
      const t = TUBES[i], a = t.a * Math.PI / 180;
      return { x: cartX + (t.x + 59 * Math.sin(a)) * ck, y: cartY + (100 - 59 * Math.cos(a)) * ck };
    }
    addEventListener('resize', () => { if (current === 'g1') layoutCart(); });

    function spawn() {                       // 구멍 하나를 골라 풍선 발사
      let i = Math.floor(Math.random() * 3);
      if (i === lastTube) i = (i + 1 + Math.floor(Math.random() * 2)) % 3;
      lastTube = i;
      cartSvg.querySelector('#bpcTube' + i).animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.14,.8)', offset: .25 },
        { transform: 'scale(.9,1.16)', offset: .55 }, { transform: 'scale(1,1)' }], { duration: 340, easing: 'ease-out' });
      cartSvg.classList.add('bp-happy');
      later(() => cartSvg.classList.remove('bp-happy'), 450);
      later(() => { const h = holePoint(i); puff(h.x, h.y); launch(i, h); fwoomp(); }, 80);
    }
    function launch(i, h) {
      const type = pickType(), t = TYPES[type];
      const w = Math.max(84, Math.min(140, vmin() * .16)) * (t.shape === 'dog' ? 1.45 : 1);
      const { el, h: bh } = makeBalloonEl(type, w);
      layer.appendChild(el);
      const b = { el, type, w, h: bh, x: h.x, y: h.y, t: 0, a: TUBES[i].a + (Math.random() * 10 - 5),
        drift: (Math.random() * 2 - 1) * 28, phase: Math.random() * 6.3, popping: false };
      balloons.push(b); byEl.set(el, b); place(b);
    }
    function place(b) {                      // b.x, b.y = 풍선 매듭 위치
      const s = Math.min(1, .3 + (1 - Math.pow(1 - Math.min(1, b.t / .28), 3)) * .7);
      const sway = Math.sin(b.t * 1.1 + b.phase) * 10 * Math.min(1, b.t);
      const knot = TYPES[b.type].shape === 'dog' ? .92 : .70;
      b.el.style.transformOrigin = `50% ${knot * 100}%`;
      b.el.style.transform = `translate(${b.x - b.w / 2 + sway}px, ${b.y - b.h * knot}px) scale(${s})`;
    }
    function puff(x, y) {
      for (let j = 0; j < 6; j++) {
        const p = document.createElement('div'); p.className = 'bp-puff';
        const s = (16 + Math.random() * 16) * ck * 1.4;
        Object.assign(p.style, { width: s + 'px', height: s + 'px', left: (x - s / 2) + 'px', top: (y - s / 2) + 'px' });
        fx.appendChild(p);
        const a = -Math.PI / 2 + (j / 5 - .5) * 2.2, d = (26 + Math.random() * 22) * ck * 1.4;
        p.animate([{ transform: 'translate(0,0) scale(.4)', opacity: .95 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(1.2)`, opacity: 0 }],
          { duration: 520, easing: 'ease-out' }).onfinish = () => p.remove();
      }
      for (let j = 0; j < 4; j++) {
        const p = document.createElement('div'); p.className = 'bp-p'; p.textContent = '✦';
        p.style.color = ['#FFD54A', '#FF8FB8', '#9CC8FF', '#B79BFF'][j]; p.style.fontSize = '16px';
        p.style.left = x + 'px'; p.style.top = y + 'px'; fx.appendChild(p);
        const a = -Math.PI / 2 + (j / 3 - .5) * 2.6, d = 50 + Math.random() * 20;
        p.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(-50%,-50%) translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(1)`, opacity: 0 }],
          { duration: 600, easing: 'ease-out' }).onfinish = () => p.remove();
      }
    }

    function frame(now) {
      if (current !== 'g1') { cleanup(); rafId = null; return; }   // 메뉴로 나가면 정리하고 멈춤
      const dt = Math.min(50, now - (last || now)) / 1000; last = now;
      if (cartState === 'arriving') {                                // 풍선차가 굴러 들어옴
        arriveT += dt / 1.7;
        const t = Math.min(1, arriveT), prev = cartX;
        cartX = arriveFrom + (arriveTo() - arriveFrom) * (1 - Math.pow(1 - t, 3));
        wheelAngle += (cartX - prev) / (40 * ck) * 180 / Math.PI; spinWheels();
        placeCart(Math.sin(arriveT * 40) * 1.6 * (1 - t));
        if (t >= 1) { cartState = 'ready'; cartJiggle(1.04, .93, 520); toot(); sinceSpawn = spawnGap() - 500; }
      }
      if (mode === 'play' && cartState === 'ready') {
        sinceSpawn += dt * 1000;
        if (sinceSpawn >= spawnGap() && balloons.filter(b => !b.popping).length < MAX_ON_SCREEN) { spawn(); sinceSpawn = 0; }
      }
      const F = speed();
      for (const b of balloons) {
        if (b.popping) continue;
        b.t += dt;
        b.y -= (F + (SPEED.launch - F) * Math.exp(-b.t / .32)) * dt;   // 처음엔 휙, 위에서는 둥실
        b.x += (Math.sin(b.a * Math.PI / 180) * 280 * Math.exp(-b.t / .5) + b.drift) * dt;
        b.x = Math.max(b.w / 2 + 8, Math.min(innerWidth - b.w / 2 - 8, b.x));
        place(b);
        if (b.y < -40) { b.el.remove(); b.gone = true; }              // 놓친 풍선: 벌점 없음
      }
      balloons = balloons.filter(b => !b.gone);
      if (mode === 'finale' && bunch) moveBunch(dt * 1000);
      rafId = requestAnimationFrame(frame);
    }

    // ----- 터지기 -----
    const WORDS = ['Pop!', 'Yay!', 'Pop!', 'Boing!'], SPECIAL_WORDS = ['Wow!', 'Super!', 'Yay!'];
    function pop(b) {
      if (!b || b.popping || mode === 'end' || mode === 'idle') return;
      b.popping = true;
      const t = TYPES[b.type], r = b.el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + (t.shape === 'dog' ? r.height * .45 : r.height * .36);
      const bx = b.el.querySelector('.bp-bx');
      b.el.querySelector('svg').classList.add('bp-happy');          // 웃는 눈 → 말랑하게 찌그러졌다 터짐
      bx.style.animation = 'none';
      bx.animate([
        { transform: 'scale(1,1)' }, { transform: 'scale(1.16,.84)', offset: .3 },
        { transform: 'scale(.9,1.12)', offset: .55 }, { transform: 'scale(1.45,1.45)', opacity: 0 }
      ], { duration: 360, easing: 'ease-out', fill: 'forwards' });
      popSfx(t.special);
      pops++;
      if (!b.inBunch) history.push(b.type);
      later(() => {
        burst(cx, cy, t, b.inBunch ? .8 : 1, true);
        if (b.line) b.line.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
        flyToCounter(cx, cy);
        if (mode === 'play') {
          updateStage();
          if (pops >= GOAL) later(startFinale, 650);
        }
        if (b.inBunch) checkBunchDone();
      }, 170);
      later(() => { b.el.remove(); byEl.delete(b.el); balloons = balloons.filter(x => x !== b); }, 420);
    }
    function burst(cx, cy, t, k, word) {
      const big = !!t.special, scale = baseW() / 120 * k;
      const ring = document.createElement('div'), rs = 90 * scale * (big ? 1.3 : 1);
      ring.className = 'bp-ring';
      Object.assign(ring.style, { width: rs + 'px', height: rs + 'px', left: (cx - rs / 2) + 'px', top: (cy - rs / 2) + 'px', borderColor: t.fx[0] });
      fx.appendChild(ring);
      ring.animate([{ transform: 'scale(.3)', opacity: .9 }, { transform: 'scale(1.9)', opacity: 0 }], { duration: 480, easing: 'ease-out' }).onfinish = () => ring.remove();
      const n = big ? 18 : 11, shapes = big ? ['★', '♥', '●', '★', '✦'] : ['★', '●', '♥', '●'];
      for (let i = 0; i < n; i++) {
        const p = document.createElement('div');
        p.className = 'bp-p'; p.textContent = shapes[i % shapes.length]; p.style.color = t.fx[i % t.fx.length];
        p.style.fontSize = (14 + Math.random() * 16) * scale * (big ? 1.15 : 1) + 'px';
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        fx.appendChild(p);
        const a = (i / n) * Math.PI * 2 + Math.random() * .4, dist = (70 + Math.random() * 70) * scale * (big ? 1.35 : 1);
        const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist, rot = (Math.random() * 2 - 1) * 260;
        p.animate([
          { transform: 'translate(-50%,-50%) translate(0,0) scale(.2) rotate(0deg)', opacity: 1 },
          { transform: `translate(-50%,-50%) translate(${dx * .85}px,${dy * .85}px) scale(1.15) rotate(${rot / 2}deg)`, opacity: 1, offset: .5 },
          { transform: `translate(-50%,-50%) translate(${dx}px,${dy + 36 * scale}px) scale(.3) rotate(${rot}deg)`, opacity: 0 }
        ], { duration: 780 + Math.random() * 320, easing: 'cubic-bezier(.15,.7,.35,1)' }).onfinish = () => p.remove();
      }
      if (!word) return;
      const list = big ? SPECIAL_WORDS : WORDS;
      popWord(cx, cy, list[Math.floor(Math.random() * list.length)], t.fx[0] === '#9CC8FF' ? '#FF8FB8' : t.fx[0], (big ? 46 : 34) * Math.max(.75, scale));
    }
    function popWord(x, y, text, color, size) {
      const w = document.createElement('div');
      w.className = 'bp-word'; w.textContent = text; w.style.color = color; w.style.fontSize = size + 'px';
      w.style.left = x + 'px'; w.style.top = y + 'px';
      fx.appendChild(w);
      w.animate([
        { transform: 'translate(-50%,-50%) scale(0)', opacity: 1 },
        { transform: 'translate(-50%,-90%) scale(1.25)', opacity: 1, offset: .25 },
        { transform: 'translate(-50%,-110%) scale(1)', opacity: 1, offset: .6 },
        { transform: 'translate(-50%,-180%) scale(.9)', opacity: 0 }
      ], { duration: 950, easing: 'ease-out' }).onfinish = () => w.remove();
    }

    // ----- 카운터: 별이 날아가 닿으면 숫자가 뿅 -----
    function flyToCounter(x, y) {
      const r = $('.bp-num').getBoundingClientRect(), tx = r.left + r.width / 2, ty = r.top + r.height / 2;
      const s = document.createElement('div');
      s.className = 'bp-p'; s.textContent = '★'; s.style.color = '#FFC93C'; s.style.fontSize = '28px';
      s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.textShadow = '0 0 8px rgba(255,201,60,.7)';
      fx.appendChild(s);
      const mx = (x + tx) / 2 + (Math.random() * 2 - 1) * 90, my = Math.min(y, ty) - 40;
      s.animate([
        { transform: 'translate(-50%,-50%) scale(.5)' },
        { transform: `translate(-50%,-50%) translate(${mx - x}px,${my - y}px) scale(1.25) rotate(180deg)`, offset: .5 },
        { transform: `translate(-50%,-50%) translate(${tx - x}px,${ty - y}px) scale(.6) rotate(360deg)` }
      ], { duration: 560, easing: 'ease-in' }).onfinish = () => { s.remove(); if (mode !== 'idle') { shown++; bumpCounter(); } };
    }
    const COUNTER_WORDS = ['Yay!', '+1', 'Pop!', '+1', 'Wow!'];
    function setCounter(n) {
      shown = n; $('.bp-num').textContent = n; $('.bp-fill').style.width = Math.min(100, n / GOAL * 100) + '%';
    }
    function bumpCounter() {
      setCounter(shown);
      $('.bp-num').animate([
        { transform: 'scale(1)' }, { transform: 'scale(1.6) rotate(-8deg)', color: '#FFB84D', offset: .3 },
        { transform: 'scale(.88) rotate(4deg)', offset: .6 }, { transform: 'scale(1)' }
      ], { duration: 440, easing: 'ease-out' });
      $('.bp-icon').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-18deg) scale(1.15)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(0)' }], { duration: 440 });
      const pr = $('.bp-pill').getBoundingClientRect(), cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
      const colors = ['#FFC93C', '#FF8FB8', '#9CC8FF', '#A77BF0'];
      for (let i = 0; i < 7; i++) {
        const p = document.createElement('div');
        p.className = 'bp-p'; p.textContent = i % 2 ? '✦' : '★'; p.style.color = colors[i % colors.length];
        p.style.fontSize = (12 + Math.random() * 8) + 'px'; p.style.left = cx + 'px'; p.style.top = cy + 'px';
        fx.appendChild(p);
        const a = Math.PI * (.05 + .9 * (i / 6)), d = pr.width * .5 + 20 + Math.random() * 24;
        const dx = Math.cos(a) * d * (i % 2 ? 1 : -1), dy = Math.sin(a) * d * .55;
        p.animate([
          { transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
          { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1)`, opacity: 1, offset: .5 },
          { transform: `translate(-50%,-50%) translate(${dx * 1.15}px,${dy + 14}px) scale(.2)`, opacity: 0 }
        ], { duration: 620, easing: 'ease-out' }).onfinish = () => p.remove();
      }
      const side = Math.random() < .5 ? -1 : 1;
      popWord(cx + side * (pr.width / 2 + 34), cy + 6, COUNTER_WORDS[Math.floor(Math.random() * COUNTER_WORDS.length)], side < 0 ? '#FF6F9F' : '#A77BF0', 24);
      sfxTone(1760 + Math.min(shown, 30) * 12, 0, .12, .12, 'sine');
    }

    // ----- 단계 배너 -----
    function updateStage() {
      let idx = 0;
      STAGES.forEach((s, i) => { if (pops >= s.at) idx = i; });
      if (idx !== stageIdx) { stageIdx = idx; if (pops < GOAL) showBanner('New balloons! ✨'); }
    }
    function showBanner(text) {
      const el = $('.bp-banner');
      el.textContent = text;
      el.getAnimations().forEach(a => a.cancel());
      el.animate([
        { transform: 'translate(-50%,-50%) scale(0)' }, { transform: 'translate(-50%,-50%) scale(1.15)', offset: .15 },
        { transform: 'translate(-50%,-50%) scale(1)', offset: .25 }, { transform: 'translate(-50%,-50%) scale(1)', offset: .85 },
        { transform: 'translate(-50%,-50%) scale(0)' }
      ], { duration: 1800, easing: 'ease-out' });
    }

    // ----- 피날레: 터트린 풍선이 한 다발로 -----
    function startFinale() {
      if (mode !== 'play') return;
      mode = 'finale-intro';
      balloons.forEach(b => {
        if (b.popping) return;
        b.popping = true;
        b.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }).onfinish = () => b.el.remove();
      });
      balloons = [];
      showBanner('You did it! 🎉');
      fanfare(false);
      later(() => { buildBunch(); mode = 'finale'; showBanner('Pop them all! 🎈'); }, 2000);
    }
    function buildBunch() {
      let list = history.slice(-GOAL);
      if (!list.length) list = ['white', 'blue', 'pink'];
      list = list.sort(() => Math.random() - .5);
      list.sort((a, b) => (TYPES[b].special ? 1 : 0) - (TYPES[a].special ? 1 : 0));   // 특별 풍선은 가운데로
      const bw = baseW() * 0.6, gap = bw * 0.52;
      const items = list.map((type, i) => { const a = i * 2.39996, r = gap * Math.sqrt(i + .3); return { type, x: Math.cos(a) * r, y: Math.sin(a) * r * .82 }; });
      const xs = items.map(i => i.x), ys = items.map(i => i.y);
      const minX = Math.min(...xs) - bw, maxX = Math.max(...xs) + bw, minY = Math.min(...ys) - bw, maxY = Math.max(...ys) + bw * .6;
      const knotY = maxY + bw * 1.5, W = maxX - minX, H = knotY - minY + bw, ox = -minX, oy = -minY;
      const wrap = document.createElement('div');
      wrap.className = 'bp-bunch'; wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
      const NS = 'http://www.w3.org/2000/svg', lines = document.createElementNS(NS, 'svg');
      lines.setAttribute('class', 'bp-lines'); lines.setAttribute('width', W); lines.setAttribute('height', H);
      wrap.appendChild(lines);
      const kx = ox, ky = oy + knotY, bb = [];
      items.sort((a, b) => a.y - b.y).forEach(it => {
        const t = TYPES[it.type], w = bw * (t.shape === 'dog' ? 1.4 : 1);
        const { el, h } = makeBalloonEl(it.type, w);
        const left = ox + it.x - w / 2, top = oy + it.y - h * .33;
        el.style.left = left + 'px'; el.style.top = top + 'px';
        const sx = ox + it.x, sy = t.shape === 'dog' ? top + h * .9 : top + h * .66;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', `M${sx} ${sy} Q${(sx + kx) / 2 + (sx - kx) * .15} ${(sy + ky) / 2} ${kx} ${ky}`);
        path.setAttribute('fill', 'none'); path.setAttribute('stroke', t.str === 'none' ? '#B9C2CF' : t.str);
        path.setAttribute('stroke-width', '1.6'); path.setAttribute('stroke-linecap', 'round');
        lines.appendChild(path);
        const b = { el, type: it.type, w, h, popping: false, inBunch: true, line: path };
        byEl.set(el, b); wrap.appendChild(el); bb.push(b);
      });
      const tail = document.createElementNS(NS, 'path');
      tail.setAttribute('d', `M${kx} ${ky} q -10 16 0 32 q 10 16 0 32`);
      tail.setAttribute('fill', 'none'); tail.setAttribute('stroke', '#FF8FB8'); tail.setAttribute('stroke-width', '2.5');
      lines.appendChild(tail);
      const bow = document.createElement('div');
      bow.className = 'bp-bow'; bow.textContent = '🎀'; bow.style.left = kx + 'px'; bow.style.top = ky + 'px'; bow.style.fontSize = bw * .55 + 'px';
      wrap.appendChild(bow);
      root.insertBefore(wrap, $('.bp-counter'));
      bunch = { wrap, balloons: bb, H, kx, y: innerHeight + 20, t: 0, v: (innerHeight + H + 40) / FINALE_SECONDS, done: false };
      moveBunch(0);
    }
    function moveBunch(dt) {
      bunch.t += dt / 1000; bunch.y -= bunch.v * dt / 1000;
      const x = innerWidth / 2 - bunch.kx + Math.sin(bunch.t * .9) * 28;
      bunch.wrap.style.transformOrigin = `${bunch.kx}px ${bunch.H}px`;
      bunch.wrap.style.transform = `translate(${x}px, ${bunch.y}px) rotate(${Math.sin(bunch.t * 1.1) * 3}deg)`;
      if (bunch.y < -bunch.H - 20) endGame();
    }
    function checkBunchDone() {
      if (!bunch || bunch.done || !bunch.balloons.every(b => b.popping)) return;
      bunch.done = true;
      showBanner('Wow! All popped! 🌟');
      later(endGame, 1300);
    }
    function endGame() {
      if (mode === 'end' || mode === 'idle') return;
      mode = 'end';
      if (bunch) { bunch.wrap.remove(); bunch = null; }
      $('.bp-endnum').textContent = pops;
      $('.bp-title').textContent = 'Great job, ' + CHILD_NAME + '! 🎉';
      $('.bp-again').hidden = sessionOver;          // 3분이 끝났으면 다시하기 대신 조용히 마무리
      const end = $('.bp-end');
      end.hidden = false;
      end.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
      $('.bp-title').animate([{ transform: 'scale(0) rotate(-10deg)' }, { transform: 'scale(1.15) rotate(3deg)', offset: .6 }, { transform: 'scale(1)' }], { duration: 700, easing: 'ease-out' });
      fanfare(true);
      const kinds = ['rainbow', 'foilGold', 'foilPink', 'heart'];
      for (let i = 0; i < 5; i++) later(() => burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.2 + Math.random() * .5), TYPES[kinds[i % kinds.length]], 1.4, false), 250 + i * 260);
      if (sessionOver) later(finishNow, 6000);
    }

    // ----- 소리 (공용 오디오 경로 사용) -----
    function sfxTone(f, t0, dur, vol, type) {
      const c = ctx(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t0;
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + dur);
      o.connect(g); g.connect(master); o.start(s); o.stop(s + dur + .02);
    }
    function popSfx(special) {
      const c = ctx(); if (!c) return;
      noise(.07, 1600, .8, .9, 0);                                   // 부드러운 '뽁'
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(240, t + .12);
      g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .16);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .18);
      (special ? [784, 988, 1175, 1568] : [1047, 1319]).forEach((f, i) => sfxTone(f, .09 + i * .075, .3, .25));
    }
    function toot() { sfxTone(523, 0, .16, .3); sfxTone(659, .17, .24, .3); }   // 풍선차 도착 '빵빵'
    function fwoomp() {                                                          // 풍선 발사 '뿅'
      const c = ctx(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(820, t + .15);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .2);
      noise(.09, 900, .8, .4, 0);
    }
    function fanfare(big) {
      const notes = big ? [523, 659, 784, 1047, 784, 1047, 1319] : [523, 659, 784, 1047];
      notes.forEach((f, i) => sfxTone(f, i * .12, i === notes.length - 1 ? .6 : .22, .3));
    }

    // ----- 시작·정리 -----
    function cleanup() {
      balloons.forEach(b => b.el.remove()); balloons = []; byEl.clear();
      if (bunch) { bunch.wrap.remove(); bunch = null; }
      fx.innerHTML = ''; layer.innerHTML = '';
      $('.bp-end').hidden = true;
      $('.bp-banner').getAnimations().forEach(a => a.cancel());
      mode = 'idle';
    }
    function start() {
      cleanup();
      pops = 0; history = []; stageIdx = 0; sinceSpawn = 99999; sessionOver = false; last = 0;
      setCounter(0);
      mode = 'play';
      cartArrive();
      if (!rafId) rafId = requestAnimationFrame(frame);
    }
    // 3분 세션 종료가 오면: 놀이 중이면 바로 피날레로, 피날레 중이면 끝까지 보여준 뒤 마무리
    function sessionEnd() {
      if (mode === 'play' && history.length) { sessionOver = true; startFinale(); return true; }   // 하나도 안 터트렸으면 바로 일반 종료
      if (mode === 'finale-intro' || mode === 'finale') { sessionOver = true; return true; }
      return false;
    }

    root.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (mode === 'end') {
        if (e.target.closest('.bp-again') && !sessionOver) { if (!gate()) return; start(); }
        return;
      }
      const el = e.target.closest('.bp-balloon');
      if (!gate()) return;
      if (el) pop(byEl.get(el));
      else if (e.target.closest('.bp-cart') && mode === 'play' && cartState === 'ready') {   // 풍선차를 누르면 바로 한 개
        cartJiggle(1.05, .92, 300);
        if (balloons.filter(b => !b.popping).length <= MAX_ON_SCREEN) { spawn(); sinceSpawn = 0; }
      } else blip();
    });

    // 땅의 꽃
    (function () {
      const g = root.querySelector('.bp-ground'), cols = ['#FFFFFF', '#FFD54A', '#FF8FB8', '#FFFFFF', '#B79BFF'];
      for (let i = 0; i < 14; i++) {
        const f = document.createElement('div'); f.className = 'bp-flower'; f.textContent = '✿';
        f.style.color = cols[i % cols.length]; f.style.left = (3 + i * 7 + Math.random() * 3) + '%';
        f.style.top = (30 + Math.random() * 50) + '%'; f.style.fontSize = (12 + Math.random() * 10) + 'px';
        g.appendChild(f);
      }
    })();

    // 구름
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('div'); d.className = 'bp-cloud';
      const w = 120 + Math.random() * 160;
      Object.assign(d.style, { width: w + 'px', height: w * .32 + 'px', top: (12 + Math.random() * 50) + '%',
        animation: `bpDrift ${60 + Math.random() * 50}s linear ${-Math.random() * 90}s infinite` });
      root.querySelector('.bp-clouds').appendChild(d);
    }

    return { start, sessionEnd };
  })();
  games.g1 = BP.start;

  // ---------- 2 큰 피아노 ----------
  var NOTES = [392, 494, 587, 784];
  games.g2 = function () {};
  screens.g2.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (!gate()) return;
    var el = document.elementFromPoint(e.clientX, e.clientY); var pad = el && el.closest('.pad');
    if (!pad) return;
    var n = +pad.dataset.n;
    tone(NOTES[n], 0, 0.6); tone(NOTES[n] * 2, 0, 0.3);
    pad.classList.remove('lit'); void pad.offsetWidth; pad.classList.add('lit');
    burst(screens.g2, e.clientX, e.clientY);
    later(function () { pad.classList.remove('lit'); }, 350);
  });

  // ---------- 3 같은 것 찾기 (그림 + 이름 소리 → 아래 두 개 중 같은 것) ----------
  (function () {
    var g = screens.g3, tgt = g.querySelector('.target'), tpic = tgt.querySelector('.tpic'), optsBox = g.querySelector('.options'), opts = g.querySelectorAll('.opt');
    var answer = null, busy = false, hintT = null;
    function showHint() { optsBox.classList.add('hint'); }
    function say() { tgt.classList.remove('say'); void tgt.offsetWidth; tgt.classList.add('say'); speak(answer.word); }
    function round() {
      busy = false; optsBox.classList.remove('hint');
      answer = pick(ITEMS, answer); var other = pick(ITEMS, answer); var left = rnd(2);
      opts[left].textContent = answer.pic; opts[1 - left].textContent = other.pic;
      opts[left].dataset.ok = '1'; opts[1 - left].dataset.ok = '';
      tpic.textContent = answer.pic;
      later(say, 350);
      hintT = later(showHint, 1800);           // 1.8초 안 치면 두 선택지가 번갈아 "여기 눌러" 신호
    }
    games.g3 = round;
    g.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (!gate() || busy) return;
      var el = document.elementFromPoint(e.clientX, e.clientY);
      if (!el) return;
      if (el === tgt || tgt.contains(el)) { say(); return; }      // 위 그림을 치면 이름을 다시 들려줌
      var opt = el.closest('.opt'); if (!opt) return;
      clearTimeout(hintT); optsBox.classList.remove('hint');
      if (opt.dataset.ok) {
        busy = true; opt.classList.add('pop'); burst(g, e.clientX, e.clientY); reward(g);
        later(function () { opt.classList.remove('pop'); round(); }, 2400);
      } else {
        tpic.classList.remove('pop'); void tpic.offsetWidth; tpic.classList.add('pop');   // 오답: 위 그림만 살짝
        later(say, 300);
        hintT = later(showHint, 1400);
      }
    });
  })();

  // ---------- 6 하나씩 담기 ----------
  games.g6 = function () {
    var g = screens.g6; g.innerHTML = '';
    var n = 2 + rnd(3);
    for (var i = 0; i < n; i++) { var p = document.createElement('div'); p.className = 'plate'; g.appendChild(p); }
  };
  screens.g6.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (!gate()) return;
    var el = document.elementFromPoint(e.clientX, e.clientY); var p = el && el.closest('.plate');
    if (!p || p.classList.contains('full')) { blip(); return; }
    p.textContent = '🍪'; p.classList.add('full', 'pop'); popSound();
    var plates = screens.g6.querySelectorAll('.plate'), full = screens.g6.querySelectorAll('.plate.full');
    if (full.length === plates.length) { reward(screens.g6); later(games.g6, 2400); }
  });

  // ---------- 7 치는 만큼 쌓기 ----------
  // 한 판(10)이 끝날 때마다 모습이 바뀜: 블록 쌓기 → 큰 숫자 → 딸기 → 블록 → 큰 숫자 → 병아리 → …
  var COUNT_PICS = ['🍓', '🐥', '⭐', '🍪', '🐸', '🎈'];
  var g7mode = 0, g7k = 0, g7pic = 0, g7busy = false;
  var stackEl = document.getElementById('stack'), digitEl = document.getElementById('digit'), itemsEl = document.getElementById('items');
  games.g7 = function () { g7mode = 0; g7pic = 0; g7round(); };
  function g7round() {
    g7k = 0; g7busy = false;
    stackEl.innerHTML = ''; digitEl.textContent = ''; itemsEl.innerHTML = '';
    var m = g7mode % 3;
    stackEl.hidden = (m !== 0); digitEl.hidden = (m !== 1); itemsEl.hidden = (m !== 2);
  }
  screens.g7.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (!gate() || g7busy) return;
    var k = g7k, m = g7mode % 3;
    if (m === 0) { var b = document.createElement('div'); b.className = 'block'; b.style.background = cssVar(k); stackEl.appendChild(b); }
    else if (m === 1) { digitEl.textContent = String(k + 1); digitEl.style.color = cssVar(k); digitEl.classList.remove('pop'); void digitEl.offsetWidth; digitEl.classList.add('pop'); }
    else { var s = document.createElement('span'); s.textContent = COUNT_PICS[g7pic % COUNT_PICS.length]; itemsEl.appendChild(s); }
    popSound(); later(function () { speak(NUMS[k], 1); }, 80);
    g7k++;
    if (g7k === NUMS.length) {
      g7busy = true;
      later(function () { reward(screens.g7); }, 900);
      later(function () { if (m === 2) g7pic++; g7mode++; g7round(); }, 3400);
    }
  });

  // ---------- 9 내 이름 ----------
  games.g9 = function () {
    var nm = document.getElementById('name'); nm.innerHTML = '';
    CHILD_NAME.split('').forEach(function (ch, i) { var s = document.createElement('span'); s.textContent = ch; s.style.color = cssVar(i); nm.appendChild(s); });
  };
  screens.g9.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (!gate()) return;
    var nm = document.getElementById('name');
    nm.classList.remove('hop'); void nm.offsetWidth; nm.classList.add('hop');
    Array.prototype.forEach.call(nm.children, function (s, i) { s.style.color = cssVar(i + rnd(6)); });
    burst(screens.g9, e.clientX, e.clientY); speak(CHILD_NAME + '!', 0.95);
  });

  // ---------- 10 그림 → 소리 → 글자 ----------
  var g10item = null;
  games.g10 = function () {
    g10item = pick(ITEMS, g10item);
    document.getElementById('g10pic').textContent = g10item.pic;
    var w = document.getElementById('word'); w.textContent = g10item.word; w.classList.remove('show');
  };
  screens.g10.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (!gate()) return;
    var pic = document.getElementById('g10pic'), w = document.getElementById('word');
    pic.classList.remove('pop'); void pic.offsetWidth; pic.classList.add('pop');
    popSound(); later(function () { speak(g10item.word); }, 100);
    if (!w.classList.contains('show')) { w.classList.add('show'); }
    else { burst(screens.g10, e.clientX, e.clientY); later(games.g10, 1200); }
  });

  // ---------- 메뉴 로고: 누르면 젤리처럼 출렁 ----------
  (function () {
    var h = document.getElementById('jellyTitle'); if (!h) return;
    h.addEventListener('pointerdown', function () { h.classList.remove('wobble'); void h.offsetWidth; h.classList.add('wobble'); });
    h.addEventListener('animationend', function (e) { if (e.animationName === 'jellyWobble') h.classList.remove('wobble'); });
  })();

  // ---------- 메뉴·종료 ----------
  screens.menu.addEventListener('click', function (e) {
    var t = e.target.closest('.tile'); if (!t) return;
    unlockAudio();   // 첫 사용자 동작으로 iOS 소리 잠금 해제
    start(t.dataset.g);
  });
  exitPad.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); backToMenu(); });
  var unlocked = false;
  document.addEventListener('touchend', function () { if (!unlocked) { unlocked = true; unlockAudio(); } }, { passive: true });
  document.addEventListener('touchmove', function (e) { if (current) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
